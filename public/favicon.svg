<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Laser Cyan to Indigo Gradient for Micro Scale -->
    <linearGradient id="fav-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Glowing CPU Core Gradient -->
    <linearGradient id="fav-core" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Gold Pin 1 Accent -->
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Hexagonal Shield Foundation -->
  <polygon
    points="16,2 29,9.5 29,22.5 16,30 3,22.5 3,9.5"
    fill="#070A12"
    stroke="url(#fav-laser)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- 2. Authentic Gold Pin 1 Indicator -->
  <circle cx="7" cy="7.5" r="1.4" fill="url(#fav-gold)" />

  <!-- 3. Central Isometric PC Chassis -->
  <!-- Top Face (Fan Exhaust) -->
  <polygon
    points="16,7.5 23.5,11.5 16,15.5 8.5,11.5"
    fill="#1E293B"
    stroke="url(#fav-laser)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Left Face (Tempered Glass Side Panel) -->
  <polygon
    points="8.5,11.5 16,15.5 16,24.5 8.5,20.5"
    fill="#0A0F1D"
    stroke="url(#fav-laser)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Right Face (Front Chassis Bezel) -->
  <polygon
    points="16,15.5 23.5,11.5 23.5,20.5 16,24.5"
    fill="#111827"
    stroke="url(#fav-laser)"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- 4. Illuminated Hardware Accents (High-Contrast at 16px/32px) -->
  <!-- CPU Core Ring / ARGB Pump -->
  <circle cx="12.2" cy="17.2" r="1.8" fill="url(#fav-core)" />
  <circle cx="12.2" cy="17.2" r="0.8" fill="#00F5FF" />

  <!-- Front Bezel Vertical Lightbar -->
  <line x1="19.8" y1="13.8" x2="19.8" y2="22.2" stroke="#00F5FF" stroke-width="1.2" stroke-linecap="round" />
</svg>
