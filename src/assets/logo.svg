<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Primary Laser Cyan to Indigo Gradient -->
    <linearGradient id="pclab-laser-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="48%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Core Luminescence Gradient (Violet to Neon Fuchsia) -->
    <linearGradient id="pclab-core-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="55%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Brushed Obsidian Titanium Chassis Substrate -->
    <linearGradient id="pclab-chassis-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <!-- Isometric Top Panel Gradient -->
    <linearGradient id="pclab-iso-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Isometric Left Glass Panel Gradient -->
    <linearGradient id="pclab-iso-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050810" stop-opacity="0.98" />
    </linearGradient>

    <!-- Isometric Front Bezel Gradient -->
    <linearGradient id="pclab-iso-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Golden Pin 1 Hardware Keying Gradient -->
    <linearGradient id="pclab-pin1-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Blueprint Dot Matrix Grid Pattern -->
    <pattern id="pclab-grid-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.75" fill="#00F5FF" opacity="0.35" />
    </pattern>

    <!-- High-Impact Bloom Filter -->
    <filter id="pclab-ambient-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Outer Hexagonal Shield Foundation (Chassis / Socket Perimeter) -->
  <polygon
    points="60,6 108,33 108,87 60,114 12,87 12,33"
    fill="url(#pclab-chassis-bg)"
    stroke="url(#pclab-laser-cyan)"
    stroke-width="3.2"
    stroke-linejoin="round"
  />

  <!-- 2. Blueprint-Dot Substrate Matrix Layer -->
  <polygon
    points="60,14 100,37 100,83 60,106 20,83 20,37"
    fill="url(#pclab-grid-pattern)"
    stroke="#1E293B"
    stroke-width="1.2"
  />

  <!-- 3. SMD Surface Mount Capacitor Arrays -->
  <g fill="#334155" stroke="#00F5FF" stroke-width="0.5" opacity="0.85">
    <rect x="23" y="47" width="3" height="6" rx="0.8" />
    <rect x="23" y="57" width="3" height="6" rx="0.8" />
    <rect x="23" y="67" width="3" height="6" rx="0.8" />
    <rect x="94" y="47" width="3" height="6" rx="0.8" />
    <rect x="94" y="57" width="3" height="6" rx="0.8" />
    <rect x="94" y="67" width="3" height="6" rx="0.8" />
  </g>

  <!-- 4. PCB Alignment Fiducial Crosshairs -->
  <g stroke="#00F5FF" stroke-width="0.8" opacity="0.45">
    <path d="M30,42 L34,42 M32,40 L32,44" />
    <path d="M86,42 L90,42 M88,40 L88,44" />
    <path d="M30,78 L34,78 M32,76 L32,80" />
    <path d="M86,78 L90,78 M88,76 L88,80" />
  </g>

  <!-- 5. High-Speed Motherboard PCB Trace Conduits -->
  <g stroke="url(#pclab-laser-cyan)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Top & Bottom Spine -->
    <path d="M60,14 L60,28" />
    <path d="M60,92 L60,106" />
    <!-- Diagonal Feeds to Chassis Corners -->
    <path d="M20,37 L34,43" />
    <path d="M20,83 L34,77" />
    <path d="M100,37 L86,43" />
    <path d="M100,83 L86,77" />
  </g>

  <!-- 6. Terminal Solder Vias (Glow Nodes) -->
  <circle cx="60" cy="18" r="2.2" fill="#00F5FF" />
  <circle cx="96" cy="39" r="2.2" fill="#0EA5E9" />
  <circle cx="96" cy="81" r="2.2" fill="#6366F1" />
  <circle cx="60" cy="102" r="2.2" fill="#8B5CF6" />
  <circle cx="24" cy="81" r="2.2" fill="#EC4899" />
  <circle cx="24" cy="39" r="2.2" fill="#00F5FF" />

  <!-- 7. Golden Pin 1 Socket Keying Triangle (AM5 / LGA Authentic Identifier) -->
  <polygon points="25,20 35,20 25,30" fill="url(#pclab-pin1-gold)" />

  <!-- 8. Central Isometric PC Chassis & Silicon Die Architecture -->
  <!-- Top Panel: Radiator Exhaust & Hex Ventilation -->
  <polygon
    points="60,28 86,43 60,58 34,43"
    fill="url(#pclab-iso-top)"
    stroke="url(#pclab-laser-cyan)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <!-- Top Exhaust Dual Fan Recesses -->
  <ellipse cx="48" cy="43" rx="6" ry="3.2" fill="#0F172A" stroke="#475569" stroke-width="0.8" />
  <ellipse cx="72" cy="43" rx="6" ry="3.2" fill="#0F172A" stroke="#475569" stroke-width="0.8" />

  <!-- Left Panel: Tempered Glass Chamber with Visible Glowing Hardware -->
  <polygon
    points="34,43 60,58 60,92 34,77"
    fill="url(#pclab-iso-glass)"
    stroke="url(#pclab-laser-cyan)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Internal Hardware: CPU Liquid Cooler Pump with Cyan Core Ring -->
  <g filter="url(#pclab-ambient-bloom)">
    <ellipse cx="47" cy="58" rx="6.5" ry="4" fill="url(#pclab-core-glow)" stroke="#FFFFFF" stroke-width="0.8" />
    <ellipse cx="47" cy="58" rx="3.5" ry="2.2" fill="#090D16" stroke="#00F5FF" stroke-width="1" />
  </g>

  <!-- Internal Hardware: High-Performance GPU Backplate & Illuminated LED Edge -->
  <g>
    <!-- GPU Backplate Angle -->
    <polygon points="38,68 56,77 56,79 38,70" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
    <!-- GPU Cyan ARGB Edge Bar -->
    <line x1="38" y1="69" x2="56" y2="78" stroke="#00F5FF" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Right Panel: Geometric Front Bezel & Cyber Intake Mesh -->
  <polygon
    points="60,58 86,43 86,77 60,92"
    fill="url(#pclab-iso-front)"
    stroke="url(#pclab-laser-cyan)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Front Bezel Vertical Laser Lightbar -->
  <line x1="73" y1="51" x2="73" y2="84" stroke="url(#pclab-laser-cyan)" stroke-width="2" stroke-linecap="round" />

  <!-- Front Bezel Power Switch Via -->
  <circle cx="73" cy="53" r="1.6" fill="#00F5FF" />

  <!-- Front Bezel Angular Intake Grooves -->
  <line x1="77" y1="63" x2="82" y2="60.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="77" y1="70" x2="82" y2="67.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />
  <line x1="77" y1="77" x2="82" y2="74.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round" />

  <!-- 9. Isometric Center Core Alignment Vertex Accent -->
  <circle cx="60" cy="58" r="1.8" fill="#FFFFFF" />
</svg>